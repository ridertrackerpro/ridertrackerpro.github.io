<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pet Sitter Profit</title>
<meta name="description" content="Gestisci lavori, clienti, animali, spese e guadagni della tua attività di pet sitter. Funziona anche offline.">
<meta name="theme-color" content="#f6f7f4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pet Sitter Profit">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
:root{
  --bg:#f6f7f4;--surface:#fff;--surface-2:#eef3ef;--sheet:#f1f5f1;--line:#e3e8e3;
  --text:#0f1a14;--muted:#5b6860;--faint:#8a968e;
  --brand:#16794f;--brand-d:#0e5f3d;--brand-l:#e1f2e8;
  --amber:#b45309;--amber-bg:#fdf0d2;--red:#c62f3a;--red-bg:#fde8ea;--blue:#2563eb;--blue-bg:#e5edfd;--violet:#6d4bc2;--violet-bg:#eee8fa;
  --r:20px;--nav-h:66px;--shadow:0 1px 2px rgba(15,26,20,.04),0 6px 18px -10px rgba(15,26,20,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d1411;--surface:#16201b;--surface-2:#1d2a23;--sheet:#121b16;--line:#26332b;--text:#eef4ef;--muted:#a3b2a8;--faint:#7b8a80;
  --brand:#3ec58a;--brand-d:#2ea874;--brand-l:#17382a;--amber:#f2b04d;--amber-bg:#3a2d12;--red:#ff7a85;--red-bg:#3d1c20;--blue:#7aa2ff;--blue-bg:#1b2845;--violet:#b49cff;--violet-bg:#2a2347;--shadow:none}}
:root[data-theme=dark]{
  --bg:#0d1411;--surface:#16201b;--surface-2:#1d2a23;--sheet:#121b16;--line:#26332b;--text:#eef4ef;--muted:#a3b2a8;--faint:#7b8a80;
  --brand:#3ec58a;--brand-d:#2ea874;--brand-l:#17382a;--amber:#f2b04d;--amber-bg:#3a2d12;--red:#ff7a85;--red-bg:#3d1c20;--blue:#7aa2ff;--blue-bg:#1b2845;--violet:#b49cff;--violet-bg:#2a2347;--shadow:none}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
.ico{flex:none;display:block}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.center{text-align:center}.mt{margin-top:18px}.mt-s{margin-top:10px}.mb{margin-bottom:14px}
.c-g{color:var(--brand)}.c-a{color:var(--amber)}.c-r{color:var(--red)}
.stack{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:2px}

/* layout */
#view{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px);min-height:100dvh}
#view.no-nav{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 36px)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav[hidden]{display:none}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:500}
.nav-item .pill{display:grid;place-items:center;width:60px;height:30px;border-radius:15px;transition:background .2s}
.nav-item.on{color:var(--brand);font-weight:700}.nav-item.on .pill{background:var(--brand-l)}
.phead{display:flex;align-items:flex-start;gap:12px;margin:4px 0 16px}
.phead h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
.shead{display:flex;align-items:center;gap:6px;margin:0 0 14px;min-height:48px}
.shead h1{font-size:21px;font-weight:800;letter-spacing:-.01em}
.shead .icon-btn:first-child{margin-left:-10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 10px}
.sec-head h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
.link{color:var(--brand);font-weight:700;font-size:15px;padding:6px 2px}
.link-ico{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-weight:700;font-size:15px}
.subrow{display:flex;justify-content:flex-end;margin:-8px 2px 10px}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;color:var(--text);flex:none}
.icon-btn:active{background:var(--surface-2)}

/* superfici */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row,.mrow-link{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;border-top:1px solid var(--line);color:inherit}
.row:first-child,.mrow-link:first-child{border-top:0}
.row:active,.mrow-link:active{background:var(--surface-2)}
.t1{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t3{color:var(--muted);font-size:13px;margin-top:2px}.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--faint);flex:none}
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:800;object-fit:cover;flex:none}
.tone-green{background:var(--brand-l);color:var(--brand)}.tone-blue{background:var(--blue-bg);color:var(--blue)}
.tico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.tico.g{background:var(--brand-l);color:var(--brand)}.tico.a{background:var(--amber-bg);color:var(--amber)}.tico.b{background:var(--blue-bg);color:var(--blue)}.tico.v{background:var(--violet-bg);color:var(--violet)}.tico.n{background:var(--surface-2);color:var(--muted)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px 18px;color:#fff;background:linear-gradient(135deg,#0a6a56 0%,#139a72 54%,#63cc57 118%);box-shadow:0 14px 30px -16px rgba(10,106,86,.7)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 68%);pointer-events:none}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.92;display:flex;align-items:center;gap:6px}
.hero .big{font-size:clamp(36px,11.5vw,46px);font-weight:800;letter-spacing:-.025em;line-height:1.1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.hero-sub{font-size:14px;opacity:.88;margin:0 0 14px}
.trend{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px 4px 9px;font-size:13px;font-weight:600;margin:2px 0 12px}
.trend.down{background:rgba(0,0,0,.22)}
.info-btn{color:#fff;display:grid;place-items:center;width:28px;height:28px;margin:-4px 0}
.goal{margin:2px 0 14px}.goal-top{display:flex;justify-content:space-between;font-size:13px;opacity:.95;margin-bottom:6px}.goal-top b{font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}.meter i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .4s}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);color:var(--text);border-radius:20px;padding:14px 6px;margin-top:10px}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.kpi{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;text-align:center;padding:0 2px}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi span{font-size:12.5px;color:var(--muted)}.kpi b{font-size:clamp(13px,4.1vw,17px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.kico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.kico.g{background:var(--brand-l);color:var(--brand)}.kico.r{background:var(--red-bg);color:var(--red)}.kico.a{background:var(--amber-bg);color:var(--amber)}.kico.o{background:var(--amber-bg);color:var(--amber)}

/* righe lavoro / cliente */
.jobrow{display:flex;align-items:center;border-top:1px solid var(--line);background:var(--surface)}
.jobrow:first-child{border-top:0}
.jobrow.st-sched{background:color-mix(in srgb,var(--blue-bg) 45%,var(--surface))}
.jobmain{display:flex;align-items:center;gap:12px;padding:12px 4px 12px 14px;flex:1;min-width:0}
.jobrow .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding:0 4px 0 6px}
.chev-link{display:grid;place-items:center;width:34px;align-self:stretch;color:var(--faint)}
.quick{width:44px;height:44px;margin:0 8px 0 2px;border-radius:50%;display:grid;place-items:center;background:var(--brand-l);color:var(--brand);flex:none}
.quick:active{background:var(--brand);color:#fff}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.b-scheduled{background:var(--blue-bg);color:var(--blue)}.b-unpaid{background:var(--amber-bg);color:var(--amber)}.b-paid{background:var(--brand-l);color:var(--brand)}
.b-credit{background:var(--violet-bg);color:var(--violet)}.b-partial{background:var(--red-bg);color:var(--red)}.b-none{background:var(--surface-2);color:var(--muted)}
.paybtn{position:relative;cursor:pointer}.paybtn::after{content:"";position:absolute;inset:-12px -8px}.paybtn:active{filter:brightness(.92)}
.t-warn{display:flex;align-items:center;gap:4px;color:var(--red);font-size:12.5px;font-weight:700;margin-top:2px}.t-warn.lg{font-size:14px;margin:6px 0}.t-warn .ico{display:inline}
.pill-bal{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap;margin-top:2px}
.pill-bal.ok{background:var(--brand-l);color:var(--brand)}.pill-bal.stack2{display:flex;flex-direction:column;align-items:flex-end;border-radius:12px;padding:4px 10px;line-height:1.25}.pill-bal.stack2 i{font-style:normal;font-weight:600;font-size:10.5px;opacity:.9}
.pill-bal.debt{background:var(--amber-bg);color:var(--amber)}.pill-bal.credit{background:var(--violet-bg);color:var(--violet)}.pill-bal.even{background:var(--surface-2);color:var(--muted)}
.day-h{margin:18px 4px 8px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty-row{display:flex;align-items:center;gap:14px}.empty-row b{display:block}.empty-row span{color:var(--muted);font-size:14px}
.crow{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.cmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:14px 4px 14px 14px}
.cmain .right{text-align:right}.cmain .right small{display:block;color:var(--muted);font-size:12px}
.crow .icon-btn{margin-right:4px;color:var(--muted)}
.t2 .ico{display:inline;vertical-align:-2px}

/* contenitori */
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.mlabel{font-size:20px;font-weight:800;letter-spacing:-.01em}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:16px;margin:0 0 14px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{padding:10px 2px;border-radius:12px;font-size:13.5px;font-weight:700;color:var(--muted);text-align:center;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;box-shadow:var(--shadow)}
.stat span{font-size:12.5px;color:var(--muted)}.stat b{font-size:clamp(14px,4.4vw,18px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.stat small{font-size:12px;color:var(--faint)}
.stats2{margin-bottom:14px}.stat-h{display:flex;align-items:center;gap:12px;padding:14px}.stat-h b{display:block;font-size:24px;font-weight:800;line-height:1.1}.stat-h span{color:var(--muted);font-size:14px}
.owed{display:flex;align-items:center;gap:14px;background:var(--amber-bg);border-color:transparent;color:var(--amber);margin-bottom:14px}
.owed.red{background:var(--red-bg);color:var(--red)}
.owed span{display:block;font-size:13px;font-weight:600}.owed b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.owed small{font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);width:100%}
.tile .tico{margin-bottom:8px}.tile b{font-size:16px}.tile span{font-size:13px;color:var(--muted);line-height:1.3}
.tile:active{background:var(--surface-2)}
.notice{display:flex;align-items:center;gap:12px;margin-top:12px;color:var(--brand);background:var(--brand-l);border-color:transparent;box-shadow:none}
.notice .grow b{display:block;color:var(--text)}.notice .grow span{display:block;font-size:13.5px;color:var(--muted)}
.notice.warn{color:var(--amber);background:var(--amber-bg)}
.welcome h3{font-size:18px;margin-bottom:10px}.welcome ol{margin:0 0 14px;padding-left:22px}.welcome li{padding:6px 0}.welcome li b{display:block}.welcome li span{color:var(--muted);font-size:14px}
.welcome{margin-top:14px}
.group{margin-bottom:20px}.group h3{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;margin:0 4px 10px}
.mrow-link b{display:block;font-size:16px}.mrow-link span{font-size:13.5px;color:var(--muted);line-height:1.3;display:block}
.mrow{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}.mrow span{color:var(--muted)}.mrow b{font-variant-numeric:tabular-nums}
.meter.lg{height:12px;background:var(--surface-2)}.meter.lg i{background:var(--brand)}.meter.lg.red i{background:var(--red)}.meter.lg.red{background:var(--red-bg)}
.mtotal{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.mtotal b:nth-of-type(1){flex:1}.mtotal b{font-size:18px;font-variant-numeric:tabular-nums}
.kvs{padding:4px 16px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.kvs>.kv:first-child,.kvs.flat>.kv:first-child{border-top:0}
.kv span{color:var(--muted)}.kv b{font-variant-numeric:tabular-nums;text-align:right}.kv.col{flex-direction:column;gap:4px}.kv.col p{white-space:pre-wrap}
.kv small{color:var(--faint);font-weight:500}
.kvs.flat{padding:0;margin-top:10px}

/* grafici */
.bars,.bars6{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:6px}
.bars6{gap:10px}.bars.year{gap:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.bpair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.bpair i{display:block;flex:1;max-width:18px;min-height:2px;border-radius:5px 5px 2px 2px;background:var(--brand)}
.bpair i.x{background:var(--red);opacity:.75}.bpair.one i{max-width:34px}
.bcol span{font-size:11px;color:var(--muted);height:14px;line-height:14px;white-space:nowrap}
.legend{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:6px}.legend i{width:10px;height:10px;border-radius:3px;background:var(--brand);margin-left:8px}.legend i:first-child{margin-left:0}.legend i.r{background:var(--red)}

/* dettaglio */
.jobhead,.chead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.jobhead h2{font-size:26px;font-weight:800;margin-top:4px}.jt{font-weight:700;margin-top:4px}
.client-link{color:var(--muted);font-size:17px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.statusbar{display:flex;align-items:center;gap:8px;margin:12px 0;padding:12px 16px;border-radius:16px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:14px}
.s-scheduled{background:var(--blue-bg);color:var(--blue)}.s-unpaid{background:var(--amber-bg);color:var(--amber)}.s-paid{background:var(--brand-l);color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;background:var(--surface-2);color:var(--brand);font-weight:700;font-size:14px}
.chead{align-items:stretch;text-align:left;gap:12px}.chead-top{display:flex;gap:14px;align-items:center}.chead h2{font-size:23px;font-weight:800;line-height:1.2}.chead .chips{justify-content:flex-start;margin:0}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;padding:14px 6px;text-align:center}
.stats4>*{display:flex;flex-direction:column;gap:2px;padding:0 2px;border-left:1px solid var(--line);min-width:0;align-items:center}.stats4>*:first-child{border-left:0}
.stats4 b{font-size:clamp(13px,3.9vw,16px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.stats4 span{font-size:12px;color:var(--muted)}
.stats4 .owe{background:var(--amber-bg);border-radius:12px;border-left:0}
.note{margin-top:12px}.note b{display:block;margin-bottom:4px}.note p{white-space:pre-wrap;color:var(--muted)}
.petcard{display:flex;align-items:center;gap:14px;width:100%}
.rec{display:flex;flex-direction:column;gap:12px}.rec.off{opacity:.65}.rec-main{display:flex;align-items:center;gap:12px;width:100%}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0 14px;min-height:50px;margin-bottom:4px;color:var(--muted)}
.searchbox input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--text);outline:none;min-width:0;min-height:48px}
.empty{text-align:center;padding:36px 20px}.empty-ico{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--brand-l);color:var(--brand)}
.empty h3{font-size:18px;margin-bottom:6px}.empty p{color:var(--muted);margin-bottom:16px}
.about{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:12px}.logo-lg{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#0a6a56,#63cc57)}.about h2{font-size:22px}

/* calcolo prezzi */
.verdict{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;font-weight:700;margin-bottom:14px}.verdict.good{background:var(--brand-l);color:var(--brand)}.verdict.bad{background:var(--amber-bg);color:var(--amber)}
.bigline{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.bigline span{color:var(--muted)}.bigline b{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}

<script>
'use strict';
/* Pet Sitter Profit — dati, utilità, calcoli, ricorrenze, import/export */
const APP_VERSION = '1.9.1';
const STORE_KEY = 'psp_db_v1';

const PET_TYPES = ['Cane','Gatto','Coniglio','Roditore','Uccello','Rettile','Pesce','Altro'];
const PAY_METHODS = ['Contanti','Satispay','Bonifico','PayPal','Altro'];
const CURRENCIES = { EUR:'Euro (€)', CHF:'Franco svizzero (CHF)', GBP:'Sterlina (£)', USD:'Dollaro ($)' };
const EXP_CATS = [
  { id:'carburante',   label:'Carburante e trasporti', icon:'car' },
  { id:'attrezzatura', label:'Attrezzatura',           icon:'tag' },
  { id:'forniture',    label:'Forniture e consumabili',icon:'gift' },
  { id:'assicurazione',label:'Assicurazione',          icon:'shield' },
  { id:'marketing',    label:'Marketing e pubblicità', icon:'star' },
  { id:'telefono',     label:'Telefono e internet',    icon:'phone' },
  { id:'formazione',   label:'Formazione',             icon:'book' },
  { id:'tasse',        label:'Tasse e contributi',     icon:'receipt' },
  { id:'altro',        label:'Altro',                  icon:'receipt' }
];
const FREQS = { weekly:'Ogni settimana', biweekly:'Ogni 2 settimane', monthly:'Ogni mese' };
const WEEKDAYS = [{d:1,l:'Lun'},{d:2,l:'Mar'},{d:3,l:'Mer'},{d:4,l:'Gio'},{d:5,l:'Ven'},{d:6,l:'Sab'},{d:0,l:'Dom'}];
const STATUS_LABEL = { scheduled:'Programmato', completed:'Completato' };
const PAY_LABEL = { paid:'Pagato', credit:'Pagato', partial:'Parziale', unpaid:'Da pagare' };
const DEFAULT_SERVICES = [
  { name:'Passeggiata 30 min',      minutes:30,  price:10 },
  { name:'Passeggiata 60 min',      minutes:60,  price:15 },
  { name:'Visita a domicilio',      minutes:30,  price:12 },
  { name:'Pet sitting giornaliero', minutes:240, price:35 },
  { name:'Notte a domicilio',       minutes:720, price:40 }
];

/* ---------- utilità ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => ymd(new Date());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monthKey = d => ymd(d).slice(0, 7);
const shiftMonth = (ym, n) => { const [y,m] = ym.split('-').map(Number); return monthKey(new Date(y, m-1+n, 1)); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthLabel = ym => { const [y,m] = ym.split('-').map(Number); return cap(new Date(y, m-1, 1).toLocaleDateString('it-IT', {month:'long', year:'numeric'})); };
const monthName  = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString('it-IT', {month:'long'}); };
const fmtDay  = s => parseD(s).toLocaleDateString('it-IT', {weekday:'short', day:'numeric', month:'short'});
const fmtFull = s => cap(parseD(s).toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long', year:'numeric'}));
const fmtShort= s => parseD(s).toLocaleDateString('it-IT', {day:'numeric', month:'short', year:'numeric'});
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const isNum = v => String(v ?? '').trim() !== '' && isFinite(parseFloat(String(v).replace(',', '.')));
const fmtDur = m => { m = Math.round(m || 0); if (m < 60) return m + ' min'; const h = Math.floor(m/60), r = m % 60; return r ? `${h} h ${r} min` : `${h} h`; };
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
function money(n) {
  n = Math.round((+n || 0) * 100) / 100; if (Object.is(n, -0)) n = 0;
  try { return new Intl.NumberFormat('it-IT', {style:'currency', currency: db.settings.currency}).format(n); }
  catch (e) { return n.toFixed(2).replace('.', ',') + ' €'; }
}
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

/* ---------- database locale ---------- */
function freshDB() {
  return {
    v: 2, clients: [], pets: [], payments: [],
    services: DEFAULT_SERVICES.map(s => ({ id: uid(), ...s })),
    jobs: [], expenses: [], recurring: [],
    settings: { name:'', currency:'EUR', kmCost:0, defaultKm:0, defaultTime:'09:00', theme:'auto', taxRate:0, goal:0, hourlyTarget:15 },
    meta: { created: new Date().toISOString(), lastBackup: null, dismissedInstall: false }
  };
}
function migrate(d) {
  const f = freshDB(); const o = Object.assign(f, d || {});
  ['clients','pets','payments','services','jobs','expenses','recurring'].forEach(k => { if (!Array.isArray(o[k])) o[k] = []; });
  o.settings = Object.assign(freshDB().settings, (d && d.settings) || {});
  o.meta = Object.assign(freshDB().meta, (d && d.meta) || {});
  o.recurring.forEach(r => { if (!Array.isArray(r.skipped)) r.skipped = []; if (!Array.isArray(r.days)) r.days = []; });
  const nd = v => { const m = String(v || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? `${m[1]}-${pad(+m[2])}-${pad(+m[3])}` : v; };
  const nt = v => { const m = String(v || '').match(/^(\d{1,2}):(\d{2})/); return m ? `${pad(+m[1])}:${m[2]}` : (v || '09:00'); };
  o.jobs.forEach(j => { j.date = nd(j.date); j.time = nt(j.time); });
  o.expenses.forEach(e => { e.date = nd(e.date); }); o.payments.forEach(p => { p.date = nd(p.date); });
  return o;
}
function loadDB() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (raw) {
    try { return migrate(JSON.parse(raw)); }
    catch (e) { try { localStorage.setItem(STORE_KEY + '_corrotto', raw); } catch (_) {} }
  }
  return freshDB();
}
let db = loadDB();
let saveFailed = false;
/* Un lavoro programmato diventa «svolto» da solo quando passa il suo orario di fine (data + ora + durata).
   Il pagamento non viene toccato: resta com'è (non pagato, salvo che l'abbia segnato tu). */
function autoCompleteJobs() {
  const now = Date.now(); let n = 0;
  const endOf = j => { const d = parseD(String(j.date).slice(0, 10)), [h, m] = String(j.time || '00:00').split(':').map(Number); d.setHours(h || 0, m || 0, 0, 0); return d.getTime() + Math.max(1, +j.minutes || 30) * 60000; };
  db.jobs.forEach(j => {
    if (j.status === 'scheduled' && !j.keep && endOf(j) <= now) {

/* ===== CONTO CLIENTE (registro pagamenti + copertura automatica) =====
   - ogni lavoro ha un importo dovuto: prezzo finale (completato) o prezzo programmato
   - un lavoro con il flag "pagato" è saldato a parte (contanti ecc.) e NON consuma credito
   - i pagamenti ricevuti dal cliente formano un credito che copre i lavori NON pagati
     in ordine cronologico (il più vecchio per primo), anche quelli futuri
   - dove il credito finisce, il lavoro risulta "parziale" o "da pagare" e il primo di
     questi viene segnato come punto in cui inizia il debito */
let _led = null;
const needOf = j => r2(j.status === 'completed' ? eff(j) : (j.price || 0));
const paymentsOf = cid => db.payments.filter(p => p.clientId === cid).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.created || 0) - (a.created || 0));
function buildLedger() {
  const L = { job: {}, client: {} };
  const ids = new Set(db.jobs.map(j => j.clientId).concat(db.payments.map(p => p.clientId)));
  ids.forEach(cid => {
    const pool = r2(sum(db.payments.filter(p => p.clientId === cid), p => p.amount));
    let rem = pool, coveredDone = 0, coveredSched = 0, schedCount = 0, debt = 0, due = 0, first = null, manual = 0, lastCov = null;
    db.jobs.filter(j => j.clientId === cid).sort(cmpJob).forEach(j => {
      const need = needOf(j);
      if (j.paid || need <= 0) { L.job[j.id] = { need, covered: need, short: 0, state: 'paid', manual: true, debtStart: false, left: rem }; if (j.status === 'completed') manual += need; return; }
      const cov = r2(Math.min(rem, need)); rem = r2(rem - cov);
      const short = r2(need - cov);
      const state = short <= 0.004 ? 'credit' : (cov > 0 ? 'partial' : 'unpaid');
      const rec = { need, covered: cov, short, state, manual: false, debtStart: false, left: rem };
      if (cov > 0) lastCov = j.id;
      if (short > 0.004 && pool > 0 && first === null) { first = j.id; rec.debtStart = true; }
      L.job[j.id] = rec;
      if (j.status === 'completed') { coveredDone += cov; debt += short; due += need; } else { coveredSched += cov; if (cov > 0) schedCount++; }
    });
    debt = r2(debt);
    /* credit = credito LIBERO: soldi ricevuti non ancora assegnati a nessun lavoro (nemmeno programmato)
       held   = credito totale in mano (libero + già assegnato ai lavori programmati) */
    const free = r2(rem);
    L.client[cid] = { pool, debt, due: r2(due), coveredDone: r2(coveredDone), coveredSched: r2(coveredSched), schedCount, free,
      credit: debt > 0 ? 0 : free, held: debt > 0 ? 0 : Math.max(0, r2(pool - coveredDone)), balance: debt > 0 ? -debt : free,
      manualPaid: r2(manual), firstShort: first, lastCov };
  });
  return L;
}
const led = () => _led || (_led = buildLedger());
const EMPTY_CL = { pool: 0, debt: 0, due: 0, coveredDone: 0, coveredSched: 0, schedCount: 0, free: 0, credit: 0, held: 0, balance: 0, manualPaid: 0, firstShort: null, lastCov: null };

function acctText(cid) {
  const L = clLedger(cid);
  if (L.debt > 0) return `deve ancora ${money(L.debt)}`;

  if (L.coveredSched > 0) return `ha tutto l'anticipo assegnato ai lavori programmati (${money(L.coveredSched)})`;
  return 'è in pari';
}

function periodStats(from, to) {
  const inR = d => d >= from && d <= to;
  const js = db.jobs.filter(j => inR(j.date));
  const done = js.filter(j => j.status === 'completed');
  const paidJobs = done.filter(j => jl(j).short <= 0.004), unpaidJobs = done.filter(j => jl(j).short > 0.004);
  const exps = db.expenses.filter(e => inR(e.date));
  const km = sum(done, j => j.km);
  const kmCost = km * (+db.settings.kmCost || 0);
  const revenue = r2(sum(done, eff)), unpaid = r2(sum(done, j => jl(j).short)), paid = r2(revenue - unpaid);
  const tips = sum(done, j => j.tip);
  const expenses = sum(exps, e => e.amount);
  const cash = r2(sum(db.payments.filter(p => inR(p.date)), p => p.amount) + sum(js.filter(j => j.paid), needOf));
  const net = cash + tips - expenses - kmCost;
  const gross = cash + tips;
  const sched = js.filter(j => j.status === 'scheduled');
  return {
    jobs: js, done, paidJobs, unpaidJobs, scheduled: sched, exps,
    revenue, paid, cash, unpaid, tips, expenses, km, kmCost, net, gross,
    minutes: sum(done, j => j.minutes),
    clientsServed: new Set(done.map(j => j.clientId)).size,
    margin: gross > 0 ? net / gross * 100 : 0,
    profitPerJob: done.length ? net / done.length : 0,
    avgTip: done.length ? tips / done.length : 0,
    expPerJob: done.length ? (expenses + kmCost) / done.length : 0,
    avgJob: done.length ? revenue / done.length : 0
  };
}

/* ---------- ricorrenze ---------- */
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function occurrences(r, from, to) {
  const res = [], start = parseD(r.start), startMon = mondayOf(start);
  for (let d = new Date(from.getFullYear(), from.getMonth(), from.getDate()); d <= to; d = addDays(d, 1)) {
    if (d < start) continue;
    if (r.freq === 'monthly') {
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      if (d.getDate() === Math.min(start.getDate(), last)) res.push(ymd(d));
    } else {
      const wk = Math.round((mondayOf(d) - startMon) / (7 * 86400000));
      if (wk % (r.freq === 'biweekly' ? 2 : 1) === 0 && (r.days || []).includes(d.getDay())) res.push(ymd(d));
    }
  }
  return res;
}
function generateRecurring(horizon = 70) {
  const today = parseD(todayStr()), limit = addDays(today, horizon);
  let changed = false;
  db.recurring.filter(r => r.active).forEach(r => {
    const start = parseD(r.start);
    const from = start > today ? start : today;
    let to = limit; if (r.end) { const e = parseD(r.end); if (e < to) to = e; }
    occurrences(r, from, to).forEach(d => {
      if (r.skipped.includes(d)) return;
      if (db.jobs.some(j => j.recurringId === r.id && j.date === d)) return;
      const p = pet(r.petId);
      addJob({ clientId: r.clientId, petId: r.petId || null, petName: p ? p.name : '', serviceId: r.serviceId || null,
               title: r.title, date: d, time: r.time, minutes: r.minutes, price: r.price, km: db.settings.defaultKm || 0, recurringId: r.id });
      changed = true;
    });
  });
  if (changed) save();
  return changed;
}
function describeRecurring(r) {
  const days = r.freq === 'monthly' ? `il giorno ${parseD(r.start).getDate()}` : r.days.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d => WEEKDAYS.find(w => w.d === d).l).join(', ');
  return `${FREQS[r.freq]} · ${days} · ${r.time}`;
}

const isNative = () => { try { return !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()); } catch (_) { return false; } };
/* App Android (Capacitor): il download del browser non funziona nella WebView → salvo il file e apro il pannello Condividi */
async function nativeSave(name, content, mime) {
  const P = window.Capacitor.Plugins || {}, FS = P.Filesystem, SH = P.Share;
  if (!FS || !SH) throw new Error('plugin mancanti');
  let data = content;
  if (content instanceof Blob) data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(content); });
  const o = { path: name, data, directory: 'CACHE' }; if (!(content instanceof Blob)) o.encoding = 'utf8';
  const res = await FS.writeFile(o);
  await SH.share({ title: name, url: res.uri, dialogTitle: name });
}
function download(name, content, mime) {
  if (isNative()) { nativeSave(name, content, mime).catch(e => { if (!(e && /cancel/i.test(String(e.message || e)))) toast('Impossibile salvare il file', { type: 'err' }); }); return; }
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function shareFile(name, content, mime) {
  if (isNative()) { download(name, content, mime); return true; }
  try {
    const file = new File([content], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return true; }
  return false;
}

/* ---------- overlay con integrazione tasto Indietro di Android ---------- */
const overlays = [];
let suppressPop = 0, pendingCb = null;
function pushOverlay(rec) {
  overlays.push(rec); history.pushState({ ov: overlays.length }, '');
  document.body.classList.add('modal-open');
}
function removeTop() {
  const o = overlays.pop(); if (!o) return false;
  o.els.forEach(e => e.classList.remove('on'));
  setTimeout(() => o.els.forEach(e => e.remove()), 300);
  if (!overlays.length) document.body.classList.remove('modal-open');
  return true;
}
function closeTop(cb) {
  if (!overlays.length) { cb && cb(); return; }
  removeTop(); suppressPop++; pendingCb = cb || null;
  const mine = pendingCb;
  history.back();
  setTimeout(() => { if (suppressPop > 0 && pendingCb === mine) { suppressPop--; pendingCb = null; mine && mine(); } }, 500);
}
function closeAll(cb) { if (!overlays.length) { cb && cb(); return; } closeTop(() => closeAll(cb)); }
window.addEventListener('popstate', () => {
  if (suppressPop > 0) { suppressPop--; const cb = pendingCb; pendingCb = null; cb && cb(); return; }
  if (overlays.length) removeTop();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlays.length) closeTop(); });

function mkLayer(cls, html) {
  const layer = $('#layer');
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const el = document.createElement('div'); el.className = cls; el.innerHTML = html;
  layer.append(scrim, el);
  requestAnimationFrame(() => requestAnimationFrame(() => { scrim.classList.add('on'); el.classList.add('on'); }));
  pushOverlay({ el, els: [scrim, el] });
  scrim.addEventListener('click', () => closeTop());
  return el;
}

/* ---------- form: lettura e validazione ---------- */
function formData(form) {
  const d = {};
  [...form.elements].forEach(e => {
    if (!e.name) return;
    if (e.type === 'checkbox') d[e.name] = e.checked;
    else if (e.type === 'radio') { if (e.checked) d[e.name] = e.value; }
    else d[e.name] = e.value;
  });
  return d;
}
function clearErrors(form) { $$('.field.bad', form).forEach(f => { f.classList.remove('bad'); const er = $('.err', f); if (er) er.hidden = true; }); }
function setErr(form, name, msg) {
  const el = form.elements[name]; if (!el) return false;
  const f = el.closest('.field'); if (f) { f.classList.add('bad'); const er = $('.err', f); if (er) { er.textContent = msg; er.hidden = false; } }
  try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.focus({ preventScroll: true }); } catch (_) {}
  return false;
}
const fInput = (name, val, o = {}) => `<input class="inp" name="${name}" type="${o.type || 'text'}" value="${esc(val ?? '')}" placeholder="${esc(o.ph || '')}" ${o.attrs || ''}>`;
const fMoney = (name, val, ph = '0,00') => fInput(name, val === '' || val == null ? '' : String(val).replace('.', ','), { ph, attrs: 'inputmode="decimal" autocomplete="off"' });
const fSelect = (name, options, val, attrs = '') => `<select class="inp" name="${name}" ${attrs}>${options.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(val ?? '') ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
const fArea = (name, val, ph = '', rows = 3) => `<textarea class="inp" name="${name}" rows="${rows}" placeholder="${esc(ph)}">${esc(val ?? '')}</textarea>`;
const field = (label, inner, hint = '') => `<label class="field"><span>${label}</span>${inner}<div class="err" hidden></div>${hint ? `<p class="hint">${hint}</p>` : ''}</label>`;
const switchRow = (name, label, checked, sub = '') => `<label class="switch-row"><span><b>${label}</b>${sub ? `<small>${sub}</small>` : ''}</span><input type="checkbox" class="switch" name="${name}" ${checked ? 'checked' : ''}></label>`;

/* ---------- sheet (pannello dal basso) ---------- */
function openSheet({ title, subtitle = '', body, submit = 'Salva', onSubmit, onOpen, extraFoot = '', noFoot = false }) {
  const el = mkLayer('sheet', `
    <div class="sheet-grab"></div>
    <div class="sheet-head"><div class="grow"><h2>${esc(title)}</h2>${subtitle ? `<p class="sub">${esc(subtitle)}</p>` : ''}</div>
      <button type="button" class="icon-btn" data-close aria-label="Chiudi">${ico('x')}</button></div>
    <form class="sheet-form" novalidate>
      <div class="sheet-body">${body}</div>
      ${noFoot ? '' : `<div class="sheet-foot"><button class="btn btn-primary btn-block" type="submit">${esc(submit)}</button>${extraFoot}</div>`}
    </form>`);
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', title);
  $('[data-close]', el).addEventListener('click', () => closeTop());
  const form = $('form', el);
  form.addEventListener('submit', e => {
    e.preventDefault(); clearErrors(form);
    const r = onSubmit ? onSubmit(formData(form), form, el) : true;
    if (r !== false) closeTop();
  });
  onOpen && onOpen(el, form);
  return el;
}

function confirmBox({ title, text = '', ok = 'Conferma', cancel = 'Annulla', danger = false, onOk }) {

    <button type="button" class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}" data-yes>${esc(ok)}</button></div>`);
  el.setAttribute('role', 'alertdialog'); el.setAttribute('aria-modal', 'true');
  $('[data-no]', el).addEventListener('click', () => closeTop());
  $('[data-yes]', el).addEventListener('click', () => closeTop(() => onOk && onOk()));
}

function actionSheet({ title, text = '', items }) {
  const el = mkLayer('sheet sheet-actions', `<div class="sheet-grab"></div>
    <div class="sheet-head"><div class="grow"><h2>${esc(title)}</h2>${text ? `<p class="sub">${esc(text)}</p>` : ''}</div>

  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', title);
  $('[data-close]', el).addEventListener('click', () => closeTop());
  $$('.action', el).forEach(b => b.addEventListener('click', () => { const it = items[+b.dataset.i]; closeTop(() => it.fn && it.fn()); }));
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, o = {}) {
  const t = $('#toast'); if (!t) return;
  t.className = 'toast on ' + (o.type || '');
  t.innerHTML = `<span>${esc(msg)}</span>${o.action ? `<button type="button">${esc(o.action.label)}</button>` : ''}`;
  if (o.action) $('button', t).onclick = () => { t.classList.remove('on'); o.action.fn(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), o.action ? 6500 : 3200);
}

/* Operazione distruttiva con "Annulla" */
function destructive(msg, fn, o = {}) {

}

  const splitAt = f === 'scheduled' || !ord.up.length || !ord.past.length ? -1 : groups.findIndex(g => g.d < todayStr());

  return `${rootHead('Lavori', 'Tutti i tuoi lavori in un posto', `<button class="btn btn-primary btn-sm" data-act="newJob">${ico('plus', 20)} Nuovo</button>`)}
  <div class="subrow"><a class="link-ico" href="#/recurring">${ico('repeat', 18)} Ricorrenti</a></div>

  <div class="seg" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${f === k}" class="${f === k ? 'on' : ''}" data-act="filter" data-f="${k}">${l}</button>`).join('')}</div>
  ${groups.length ? groups.map((g, i) => `${i === splitAt ? '<div class="past-div"><span>Giorni già passati</span></div>' : ''}<div class="day-h ${g.d === todayStr() ? 'today' : ''}">${dayLabel(g.d)}</div>${jobList(g.items, { quick: true })}`).join('')

};

function calcPricing() {
  const root = $('#view'); if (!root || !$('#pr-out')) return;
  const g = n => root.querySelector(`[name="${n}"]`);
  const price = num(g('price').value), min = num(g('minutes').value), trv = num(g('travel').value), km = num(g('km').value);
  const kmc = num(g('kmcost').value), extra = num(g('extra').value), tax = Math.min(num(g('tax').value), 90), target = num(g('target').value);
  const hours = (min + trv) / 60, costs = km * kmc + extra, taxAmt = price * tax / 100;
  const profit = price - costs - taxAmt, hourly = hours > 0 ? profit / hours : 0, margin = price > 0 ? profit / price * 100 : 0;
  const rec = hours > 0 && target > 0 ? Math.ceil(((target * hours + costs) / (1 - tax / 100)) * 2) / 2 : 0;
  const be = costs / (1 - tax / 100);
  const ok = target > 0 ? hourly >= target : profit > 0;
  const out = $('#pr-out');
  if (!price || !min) { out.innerHTML = `<div class="muted center">Inserisci prezzo e durata per vedere il risultato.</div>`; $('#pr-apply').hidden = true; return; }
  out.innerHTML = `<div class="verdict ${ok ? 'good' : 'bad'}">${ico(ok ? 'checkCircle' : 'alert', 22)}<span>${ok ? 'Sei in linea con il tuo obiettivo' : (target > 0 ? `Sotto l'obiettivo di ${money(target)}/h` : 'Il lavoro non è in utile')}</span></div>
    <div class="bigline"><span>Guadagno reale all'ora</span><b class="${hourly < 0 ? 'c-r' : 'c-g'}">${money(hourly)}</b></div>
    <div class="kvs flat">${kv('Tempo totale', fmtDur(min + trv))}${kv('Costi (km + extra)', money(costs))}${tax ? kv('Tasse e contributi', money(taxAmt)) : ''}${kv('Profitto reale', money(profit))}${kv('Margine', Math.round(margin) + '%')}${kv('Prezzo minimo (pareggio)', money(be))}</div>
    ${rec ? `<div class="recbox"><span>Prezzo consigliato</span><b>${money(rec)}</b><small>per guadagnare ${money(target)}/h reali</small></div>` : ''}`;
  const sid = g('svc').value; const ap = $('#pr-apply'); ap.hidden = !(sid && rec); ap.dataset.price = rec; ap.dataset.id = sid;
}

/* ---------- ROUTER ---------- */
const ROUTES = [['/', 'home', 1], ['/jobs', 'jobs', 1], ['/money', 'money', 1], ['/clients', 'clients', 1], ['/more', 'more', 1],
  ['/job/:id', 'job'], ['/client/:id', 'client'], ['/archived', 'archived'], ['/expenses', 'expenses'], ['/services', 'services'], ['/pricing', 'pricing'],
  ['/reports', 'reports'], ['/recurring', 'recurring'], ['/export', 'exportPage'], ['/backup', 'backup'], ['/settings', 'settings'], ['/about', 'about']];
function matchRoute(path) {
  const seg = path.split('/').filter(Boolean);
  for (const [pat, name, root] of ROUTES) {
    const ps = pat.split('/').filter(Boolean); if (ps.length !== seg.length) continue;
    const params = {}; let ok = true;
    ps.forEach((p, i) => { if (p[0] === ':') params[p.slice(1)] = decodeURIComponent(seg[i]); else if (p !== seg[i]) ok = false; });
    if (ok) return { name, params, root: !!root };
  }
  return null;
}
const NAV = [['home', 'home', 'Home'], ['jobs', 'briefcase', 'Lavori'], ['money', 'chart', 'Soldi'], ['clients', 'paw', 'Clienti'], ['more', 'dots', 'Altro']];
function renderNav(active) {
  const nav = $('#nav'); if (!nav) return;
  nav.innerHTML = `<div class="nav-in">${NAV.map(([k, i, l]) => `<a class="nav-item ${active === k ? 'on' : ''}" href="#/${k === 'home' ? '' : k}" ${active === k ? 'aria-current="page"' : ''}><span class="pill">${ico(i, 24)}</span><span>${l}</span></a>`).join('')}</div>`;
}
function render() {
  const y = window.scrollY, m = matchRoute(current.path);
  afterRender = null;
  const html = m ? views[m.name](m.params, current.q) : `${subHead('Pagina non trovata', '#/')}${empty('alert', 'Pagina non trovata', 'Questo indirizzo non esiste.', '<a class="btn btn-primary" href="#/">Vai alla Home</a>')}`;
  const v = $('#view'); v.innerHTML = html;
  const root = !!(m && m.root);
  v.classList.toggle('no-nav', !root); document.body.classList.toggle('has-nav', root);
  $('#nav').hidden = !root;
  renderNav(root ? m.name : null);
  if (afterRender) afterRender();
  if (current.path === lastPath) window.scrollTo(0, y); else { window.scrollTo(0, 0); lastPath = current.path; }
}
function route() {
  let h = location.hash.slice(1) || '/'; const [path, qs] = h.split('?');
  current = { path: path || '/', params: {}, q: new URLSearchParams(qs || '') };
  routeCount++;
  if (current.path === '/new') { history.replaceState(null, '', '#/'); current.path = '/'; render(); jobForm(); return; }
  render();
}
function go(hash, replace = false) { if (replace) { history.replaceState(null, '', hash); route(); } else location.hash = hash; }

/* ===== CALENDARIO A SELEZIONE MULTIPLA ===== */
function mountCalendar(el, form, { multi, initial, onChange }) {
  const input = form.elements.dates, box = $('#cal', el), list = $('#calSel', el);
  const sel = new Set(initial), busy = new Set(db.jobs.map(j => j.date));
  let view = (initial[0] || todayStr()).slice(0, 7);
  const arr = () => [...sel].sort();
  const sync = () => { input.value = arr().join(','); const f = input.closest('.field'); if (f) { f.classList.remove('bad'); const er = $('.err', f); if (er) er.hidden = true; } onChange && onChange(arr()); };
  const draw = () => {
    const [y, m] = view.split('-').map(Number), lead = (new Date(y, m - 1, 1).getDay() + 6) % 7, n = new Date(y, m, 0).getDate(), t = todayStr();
    let cells = '<span></span>'.repeat(lead);
    for (let d = 1; d <= n; d++) {
      const ds = `${view}-${pad(d)}`;
      cells += `<button type="button" class="cal-d ${sel.has(ds) ? 'on' : ''} ${ds === t ? 'today' : ''} ${ds < t ? 'past' : ''}" data-d="${ds}" aria-pressed="${sel.has(ds)}" aria-label="${fmtFull(ds)}">${d}${busy.has(ds) ? '<i></i>' : ''}</button>`;
    }
    box.innerHTML = `<div class="cal-head"><button type="button" class="icon-btn" data-m="-1" aria-label="Mese precedente">${ico('chevL')}</button><div class="cal-title">${monthLabel(view)}</div><button type="button" class="icon-btn" data-m="1" aria-label="Mese successivo">${ico('chevR')}</button></div>
      <div class="cal-wd">${['L', 'M', 'M', 'G', 'V', 'S', 'D'].map(x => `<span>${x}</span>`).join('')}</div><div class="cal-grid">${cells}</div>
      <p class="cal-leg"><i></i> Hai già un lavoro in quel giorno</p>`;
    const a = arr();
    list.innerHTML = a.length
      ? `<div class="sel-top"><b>${multi ? plural(a.length, 'giorno selezionato', 'giorni selezionati') : 'Giorno scelto'}</b>${multi && a.length > 1 ? '<button type="button" data-clear>Svuota</button>' : ''}</div><div class="sel-list">${a.map(ds => `<button type="button" class="sel-chip" data-rm="${ds}" aria-label="Rimuovi ${fmtFull(ds)}">${fmtDay(ds)} ${ico('x', 14)}</button>`).join('')}</div>`
      : `<p class="hint">Nessun giorno selezionato: tocca i giorni sul calendario.</p>`;
  };
  box.addEventListener('click', e => {
    const mb = e.target.closest('[data-m]'), dd = e.target.closest('[data-d]');
    if (mb) { view = shiftMonth(view, +mb.dataset.m); draw(); return; }
    if (dd) { const ds = dd.dataset.d; if (multi) { sel.has(ds) ? sel.delete(ds) : sel.add(ds); } else { sel.clear(); sel.add(ds); } sync(); draw(); try { navigator.vibrate && navigator.vibrate(8); } catch (_) {} }
  });
  list.addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]'), cl = e.target.closest('[data-clear]');
    if (rm) { sel.delete(rm.dataset.rm); sync(); draw(); } else if (cl) { sel.clear(); sync(); draw(); }
  });
  sync(); draw();
}

/* applica il completamento (usato sia per salvare sia per l'anteprima) */
function runCompletion(j, d, covered) {
  const fin = d.finalPrice === '' || d.finalPrice == null ? j.price : num(d.finalPrice);
  const rec = d.received && num(d.received) > 0 ? r2(num(d.received)) : 0;
  /* Se scrivi i soldi ricevuti, vengono registrati come pagamento del cliente e il sistema salda
     i lavori non pagati dal più vecchio al più recente (questo compreso). Altrimenti vale l'interruttore «Pagato». */
  const paid = rec > 0 || covered ? false : !!d.paid;
  applyCompletion(j, { finalPrice: fin, tip: num(d.tip), paid, method: d.method || '', km: num(d.km), notes: d.notes === undefined ? j.notes : (d.notes || '').trim() });
  if (rec > 0) db.payments.push({ id: uid(), clientId: j.clientId, amount: rec, date: todayStr(), method: d.method || '', notes: 'Incassato al lavoro del ' + fmtShort(j.date), created: Date.now() });
  return { fin, paid, received: rec };
}
/* simulazione su una copia dei dati: cosa succederebbe al conto del cliente */
function previewCompletion(j, d, covered) {
  const real = db, before = real.jobs.filter(x => x.clientId === j.clientId && x.status === 'completed' && x.id !== j.id && jl(x).short > 0.004).map(x => x.id);
  try {
    db = JSON.parse(JSON.stringify(real)); _led = null;
    runCompletion(db.jobs.find(x => x.id === j.id), d, covered);
    const L = clLedger(j.clientId), settled = before.filter(id => jl(db.jobs.find(x => x.id === id)).short <= 0.004).length;
    return { debt: L.debt, credit: L.credit, settled, before: before.length };
  } finally { db = real; _led = null; }
}

/* ===== PAGAMENTO RICEVUTO DAL CLIENTE (acconti / credito) ===== */
function paymentForm(cid, id) {
  const edit = id ? db.payments.find(p => p.id === id) : null; if (id && !edit) return;
  cid = edit ? edit.clientId : cid;
  const pick = !edit && !cid;
  if (pick && !db.clients.some(x => !x.archived)) { toast('Aggiungi prima un cliente', { type: 'err' }); return; }
  let c = client(cid); if (!pick && !c) return;
  const CL = cid ? clLedger(cid) : { debt: 0, credit: 0, coveredSched: 0 };
  const p = edit || { amount: CL.debt > 0 ? CL.debt : '', date: todayStr(), method: '', notes: '' };
  const state = CL.debt > 0 ? `Ora deve ${money(CL.debt)}` : CL.credit > 0 ? `Credito libero ${money(CL.credit)}` : CL.coveredSched > 0 ? 'Anticipo già assegnato ai lavori' : 'In pari';
  openSheet({
    title: edit ? 'Modifica pagamento' : 'Pagamento ricevuto', subtitle: pick ? 'Scegli il cliente e quanto ti ha dato' : `${c.name} · ${state}`, submit: edit ? 'Salva modifiche' : 'Registra pagamento',
    extraFoot: edit ? `<button type="button" class="btn btn-ghost btn-danger btn-block" data-del>${ico('trash', 20)} Elimina pagamento</button>` : '',
    body: `${pick ? field('Cliente *', fSelect('clientId', [{ v: '', l: 'Seleziona cliente…' }, ...db.clients.filter(x => !x.archived).sort((a, b) => a.name.localeCompare(b.name, 'it')).map(x => ({ v: x.id, l: x.name }))], '')) : ''}<p class="hint mb">Anche se è più di quanto deve: la differenza resta come <b>credito</b> e viene scalata in automatico dai lavori, dal più vecchio al più recente.</p>
      <div class="grid2">${field('Importo ricevuto *', fMoney('amount', p.amount))}${field('Data *', fInput('date', p.date, { type: 'date' }))}</div>
      ${pick ? '<div class="hint mb" id="payPrev" hidden></div>' : ''}
      ${field('Metodo', fSelect('method', payOpts, p.method))}${field('Note', fArea('notes', p.notes, 'es. anticipo per le vacanze', 2))}`,
    onOpen: (el, form) => {
      if (pick) {
        const prev = $('#payPrev', el), f = form.elements;
        const upd = () => {
          const id = f.clientId.value, a = num(f.amount.value), cl = client(id);
          if (!cl) { prev.hidden = true; return; }
          const now = clLedger(id); let txt = now.debt > 0 ? `Ora ${cl.name.split(' ')[0]} deve ${money(now.debt)}.` : now.credit > 0 ? `Ora ha un credito libero di ${money(now.credit)}.` : 'Ora è in pari.';
          if (isNum(f.amount.value) && a > 0) {
            db.payments.push({ id: '__tmp', clientId: id, amount: r2(a), date: f.date.value || todayStr(), created: Date.now() }); _led = null;
            try { txt += ` Dopo questo pagamento: ${cl.name.split(' ')[0]} ${acctText(id)}.`; } finally { db.payments = db.payments.filter(x => x.id !== '__tmp'); _led = null; }
          }
          prev.textContent = txt; prev.hidden = false;
        };
        ['change', 'input'].forEach(ev => form.addEventListener(ev, e => { if (['clientId', 'amount', 'date'].includes(e.target.name)) upd(); }));
        f.clientId.addEventListener('change', () => { const cl = client(f.clientId.value), L = cl ? clLedger(cl.id) : null; if (L && L.debt > 0 && !f.amount.value) f.amount.value = String(L.debt).replace('.', ','); upd(); });
      } const del = $('[data-del]', el); if (del) del.onclick = () => closeTop(() => destructive('Pagamento eliminato', () => { db.payments = db.payments.filter(x => x.id !== edit.id); })); },
    onSubmit: (d, form) => {
      if (pick) { if (!d.clientId) return setErr(form, 'clientId', 'Seleziona un cliente'); cid = d.clientId; c = client(cid); }
      if (!isNum(d.amount) || num(d.amount) <= 0) return setErr(form, 'amount', 'Inserisci un importo maggiore di zero');
      if (!d.date) return setErr(form, 'date', 'Inserisci la data');
      const data = { amount: r2(num(d.amount)), date: d.date, method: d.method || '', notes: d.notes.trim() };
      if (edit) Object.assign(edit, data); else db.payments.push({ id: uid(), clientId: cid, created: Date.now(), ...data });
      save(); render();
      const N = clLedger(cid), first = c.name.split(' ')[0];
      toast(`Registrato · ${first} ${acctText(cid)}`);
    }
  });
}

/* ===== CLIENTE ===== */
function clientForm(id, cb = {}) {
  const edit = id ? client(id) : null, c = edit || { name: '', phone: '', email: '', address: '', notes: '' };
  openSheet({
    title: edit ? 'Modifica cliente' : 'Nuovo cliente', submit: edit ? 'Salva modifiche' : 'Aggiungi cliente',
    body: `${field('Nome del cliente *', fInput('name', c.name, { ph: 'Nome e cognome', attrs: 'autocomplete="off" autocapitalize="words" maxlength="80"' }))}
      ${field('Telefono', fInput('phone', c.phone, { type: 'tel', ph: 'es. 333 1234567', attrs: 'autocomplete="off"' }))}
      ${field('Email', fInput('email', c.email, { type: 'email', ph: 'nome@email.it', attrs: 'autocomplete="off" autocapitalize="off"' }))}
      ${field('Indirizzo', fInput('address', c.address, { ph: 'Via, numero, città', attrs: 'autocomplete="off"' }))}
      ${field('Note', fArea('notes', c.notes, 'Orari preferiti, citofono, accordi particolari…'))}`,
    onSubmit: (d, form) => {
      const name = d.name.trim(); if (!name) return setErr(form, 'name', 'Inserisci il nome del cliente');
      if (d.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) return setErr(form, 'email', 'Email non valida');
      if (!edit && db.clients.some(x => x.name.toLowerCase() === name.toLowerCase() && !form.dataset.dup)) { form.dataset.dup = '1'; return setErr(form, 'name', 'Esiste già un cliente con questo nome. Tocca di nuovo per aggiungerlo comunque.'); }
      const data = { name, phone: d.phone.trim(), email: d.email.trim(), address: d.address.trim(), notes: d.notes.trim() };
      if (edit) { Object.assign(edit, data); save(); render(); toast('Cliente aggiornato'); return; }
      const nc = { id: uid(), archived: false, created: Date.now(), ...data }; db.clients.push(nc); save();
      if (cb.onSaved) { closeTop(() => { render(); cb.onSaved(nc); }); return false; }
      closeTop(() => { go('#/client/' + nc.id); toast('Cliente aggiunto · ora aggiungi il suo animale'); }); return false;
    }
  });
}

      ${field('Servizio abituale', fSelect('serviceId', [{ v: '', l: 'Nessuno' }, ...db.services.map(s => ({ v: s.id, l: `${s.name} · ${fmtDur(s.minutes)} · ${money(s.price)}` }))], p.serviceId), 'Verrà proposto per primo quando inserisci un lavoro per questo animale. Puoi sempre scegliere un altro servizio.')}
      <button type="button" class="link-btn" id="newSvc" style="margin:-6px 0 14px">${ico('plus', 18)} Crea un nuovo servizio</button>
      ${field('Note', fArea('notes', p.notes, 'Allergie, carattere, veterinario, cibo, dove sono le chiavi…', 4))}`,
    onOpen: (el, form) => {
      const refresh = () => { $('#pp', el).innerHTML = photo ? `<img src="${photo}" alt="">` : ico('paw', 34); $('#pp-btn', el).innerHTML = `${ico('camera', 20)} ${photo ? 'Cambia foto' : 'Aggiungi foto'}`; $('#pp-rm', el).hidden = !photo; };
      refresh();
      $('#pp-btn', el).onclick = () => $('#pp-file', el).click();
      $('#pp-rm', el).onclick = () => { photo = ''; refresh(); };
      $('#pp-file', el).onchange = async e => { const f = e.target.files[0]; if (!f) return; try { photo = await resizePhoto(f); refresh(); } catch (err) { toast('Impossibile leggere la foto', { type: 'err' }); } e.target.value = ''; };
      $('#newSvc', el).onclick = () => serviceForm(null, { onSaved: ns => { const sel = form.elements.serviceId; sel.add(new Option(`${ns.name} · ${fmtDur(ns.minutes)} · ${money(ns.price)}`, ns.id)); sel.value = ns.id; } });
      const del = $('[data-del]', el);
      if (del) del.onclick = () => confirmBox({ title: `Eliminare ${edit.name}?`, text: 'I lavori già registrati restano nello storico.', ok: 'Elimina', danger: true,
        onOk: () => closeTop(() => destructive('Animale eliminato', () => { db.jobs.filter(j => j.petId === edit.id).forEach(j => { j.petName = edit.name; j.petId = null; }); db.recurring.forEach(r => { if (r.petId === edit.id) r.petId = null; }); db.pets = db.pets.filter(x => x.id !== edit.id); })) });
    },
    onSubmit: (d, form) => {
      const name = d.name.trim(); if (!name) return setErr(form, 'name', 'Inserisci il nome dell\'animale');
      const data = { name, type: d.type || 'Altro', breed: d.breed.trim(), serviceId: d.serviceId || '', notes: d.notes.trim(), photo };
      if (edit) { Object.assign(edit, data); db.jobs.filter(j => j.petId === edit.id).forEach(j => j.petName = name); save(); render(); toast('Animale aggiornato'); return; }
      const np = { id: uid(), clientId: cid, ...data }; db.pets.push(np);
      if (!save()) { db.pets.pop(); return false; }
      if (cb.onSaved) { closeTop(() => { render(); cb.onSaved(np); }); return false; }
      render(); toast('Animale aggiunto');

}

/* ===== RICORRENZA ===== */
function recurringForm(id) {
  const edit = id ? db.recurring.find(r => r.id === id) : null;
  if (!edit && !db.clients.some(c => !c.archived)) { toast('Aggiungi prima un cliente', { type: 'err' }); return; }
  const r = edit || { clientId: '', petId: '', serviceId: '', title: '', time: db.settings.defaultTime || '09:00', minutes: 30, price: '', freq: 'weekly', days: [parseD(todayStr()).getDay()], start: todayStr(), end: '' };
  const cOpts = [{ v: '', l: 'Seleziona cliente…' }, ...db.clients.filter(c => !c.archived || c.id === r.clientId).sort((a, b) => a.name.localeCompare(b.name, 'it')).map(c => ({ v: c.id, l: c.name }))];
  const pOpts = cid => [{ v: '', l: cid ? 'Nessun animale' : 'Scegli prima il cliente' }, ...petsOf(cid).map(p => ({ v: p.id, l: `${p.name} (${p.type})` }))];
  openSheet({
    title: edit ? 'Modifica serie' : 'Nuova serie ricorrente', submit: edit ? 'Salva e rigenera' : 'Crea serie',
    body: `${field('Cliente *', fSelect('clientId', cOpts, r.clientId))}${field('Animale', fSelect('petId', pOpts(r.clientId), r.petId))}
      ${field('Servizio', fSelect('serviceId', [{ v: '', l: 'Personalizzato' }, ...db.services.map(s => ({ v: s.id, l: `${s.name} · ${money(s.price)}` }))], r.serviceId))}
      ${field('Titolo', fInput('title', r.title, { ph: 'es. Passeggiata mattutina', attrs: 'maxlength="80"' }))}
      <div class="grid3">${field('Ora', fInput('time', r.time, { type: 'time' }))}${field('Durata (min)', fInput('minutes', r.minutes, { attrs: 'inputmode="numeric"' }))}${field('Prezzo *', fMoney('price', r.price))}</div>
      ${field('Frequenza', fSelect('freq', Object.entries(FREQS).map(([v, l]) => ({ v, l })), r.freq))}
      <div id="daysWrap" ${r.freq === 'monthly' ? 'hidden' : ''}><div class="field"><span>Giorni della settimana</span><div class="daychips">${WEEKDAYS.map(w => `<label class="daychip"><input type="checkbox" name="d${w.d}" ${r.days.includes(w.d) ? 'checked' : ''}><span>${w.l}</span></label>`).join('')}</div><div class="err" hidden></div></div></div>
      <div class="grid2">${field('Inizio *', fInput('start', r.start, { type: 'date' }))}${field('Fine (facoltativa)', fInput('end', r.end || '', { type: 'date' }))}</div>`,
    onOpen: (el, form) => {
      const f = form.elements;
      f.clientId.addEventListener('change', () => { f.petId.innerHTML = pOpts(f.clientId.value).map(x => `<option value="${esc(x.v)}">${esc(x.l)}</option>`).join(''); const ps = petsOf(f.clientId.value); if (ps.length === 1) { f.petId.value = ps[0].id; f.petId.dispatchEvent(new Event('change')); } });
      f.petId.addEventListener('change', () => { const sv = service((pet(f.petId.value) || {}).serviceId); if (sv && !f.serviceId.value) { f.serviceId.value = sv.id; f.serviceId.dispatchEvent(new Event('change')); } });
      f.serviceId.addEventListener('change', () => { const sv = service(f.serviceId.value); if (!sv) return; if (!f.title.value) f.title.value = sv.name; f.price.value = String(sv.price).replace('.', ','); f.minutes.value = sv.minutes; });
      f.freq.addEventListener('change', () => { $('#daysWrap', el).hidden = f.freq.value === 'monthly'; });
    },
    onSubmit: (d, form) => {
      if (!d.clientId) return setErr(form, 'clientId', 'Seleziona un cliente');
      if (!isNum(d.price) || num(d.price) < 0) return setErr(form, 'price', 'Inserisci il prezzo');
      if (!d.start) return setErr(form, 'start', 'Inserisci la data di inizio');
      if (d.end && d.end < d.start) return setErr(form, 'end', 'La fine è prima dell\'inizio');
      const days = WEEKDAYS.filter(w => d['d' + w.d]).map(w => w.d);
      if (d.freq !== 'monthly' && !days.length) { const el = $('#daysWrap .field', form); el.classList.add('bad'); const er = $('.err', el); er.textContent = 'Scegli almeno un giorno'; er.hidden = false; return false; }
      const sv = service(d.serviceId);
      const data = { clientId: d.clientId, petId: d.petId || null, serviceId: sv ? sv.id : null, title: d.title.trim() || (sv ? sv.name : 'Lavoro'), time: d.time || '09:00',
        minutes: Math.max(1, Math.round(num(d.minutes)) || 30), price: num(d.price), freq: d.freq, days: d.freq === 'monthly' ? [] : days, start: d.start, end: d.end || null };
      if (edit) { Object.assign(edit, data); removeFutureSeriesJobs(edit.id, todayStr()); } else db.recurring.push({ id: uid(), active: true, skipped: [], ...data });
      generateRecurring(); save(); render(); toast(edit ? 'Serie aggiornata' : 'Serie creata · lavori generati');
    }
  });
}

A.jobPay = d => payForm(d.id);
A.cjToggle = () => { ui.cjAll = !ui.cjAll; render(); };
A.payAdd = d => paymentForm(d.client);
A.payQuick = () => paymentForm(null);
A.payEdit = d => paymentForm(null, d.id);
A.togglePaid = d => {
  const j = db.jobs.find(x => x.id === d.id); if (!j) return;
  const was = payState(j);
  if (j.paid) { destructive('Segnato come non pagato', () => { j.paid = false; j.paidOn = null; }); return; }
  if (was === 'credit') {
    const c = client(j.clientId);
    actionSheet({ title: 'Pagato con il credito del cliente', text: 'Questo lavoro è coperto dai soldi che il cliente ti ha dato. Per modificarlo cambia i suoi pagamenti.', items: [
      { label: 'Vai al conto del cliente', icon: 'coin', fn: () => c && go('#/client/' + c.id) },
      { label: 'Incassato a parte (libera il credito)', icon: 'check', fn: () => destructive('Pagato a parte · il credito resta per i prossimi lavori', () => { j.paid = true; j.paidOn = todayStr(); }) }] });
    return;
  }
  destructive(was === 'credit' || was === 'partial' ? 'Pagato a parte · il credito resta per i prossimi lavori' : 'Segnato come pagato ✓', () => { j.paid = true; j.paidOn = todayStr(); });
};
A.jobUnpay = d => { const j = db.jobs.find(x => x.id === d.id); if (!j) return; j.paid = false; j.paidOn = null; save(); render(); toast('Segnato come non pagato'); };
A.jobReopen = d => confirmBox({ title: 'Riportare a "programmato"?', text: 'Prezzo finale, mancia e pagamento verranno azzerati.', ok: 'Riporta', onOk: () => { const j = db.jobs.find(x => x.id === d.id); if (!j) return; destructive('Lavoro riaperto', () => { Object.assign(j, { status: 'scheduled', paid: false, finalPrice: null, tip: 0, method: '', paidOn: null, completedOn: null, auto: false, keep: true }); }); } });
A.jobEdit = d => jobForm({ id: d.id });
A.jobDup = d => jobForm({ from: d.id });
A.jobIcs = d => { const j = db.jobs.find(x => x.id === d.id); if (!j) return; download(`lavoro-${j.date}.ics`, icsFor(j), 'text/calendar'); toast('File calendario scaricato: aprilo per aggiungerlo'); };
A.jobDel = d => {
  const j = db.jobs.find(x => x.id === d.id); if (!j) return;
  const r = db.recurring.find(x => x.id === j.recurringId);
  const only = () => { destructive('Lavoro eliminato', () => { if (r && !r.skipped.includes(j.date)) r.skipped.push(j.date); db.jobs = db.jobs.filter(x => x.id !== j.id); }, { render: false }); leave('#/jobs'); };
  const future = () => { destructive('Serie eliminata da questa data', () => { if (r) { const prev = ymd(addDays(parseD(j.date), -1)); if (prev < r.start) db.recurring = db.recurring.filter(x => x.id !== r.id); else r.end = prev; } db.jobs = db.jobs.filter(x => !(x.recurringId === j.recurringId && x.status === 'scheduled' && x.date >= j.date)); }, { render: false }); leave('#/jobs'); };
  if (r) actionSheet({ title: 'Elimina lavoro ricorrente', text: describeRecurring(r), items: [{ label: 'Solo questo lavoro', icon: 'trash', danger: true, fn: only }, { label: 'Questo e i successivi', icon: 'repeat', danger: true, fn: future }] });
  else confirmBox({ title: 'Eliminare il lavoro?', text: j.status === 'completed' ? 'Verrà tolto anche dai guadagni.' : '', ok: 'Elimina', danger: true, onOk: only });
};
A.clientMenu = d => {
  const c = client(d.id); if (!c) return;
  actionSheet({ title: c.name, items: [
    { label: 'Aggiungi lavoro', icon: 'plus', fn: () => jobForm({ clientId: c.id }) },
    { label: 'Pagamento ricevuto', icon: 'coin', fn: () => paymentForm(c.id) },
    { label: 'Aggiungi animale', icon: 'paw', fn: () => petForm({ clientId: c.id }) },
    { label: 'Modifica cliente', icon: 'edit', fn: () => clientForm(c.id) },
    c.archived ? { label: 'Ripristina cliente', icon: 'undo', fn: () => A.clientRestore({ id: c.id }) } : { label: 'Archivia cliente', icon: 'archive', fn: () => A.clientArchive({ id: c.id }) },
    { label: 'Elimina cliente', icon: 'trash', danger: true, fn: () => A.clientDel({ id: c.id }) }] });
};
A.clientEdit = d => clientForm(d.id);
A.clientArchive = d => { const c = client(d.id); if (!c) return; c.archived = true; save(); render(); toast('Cliente archiviato', { action: { label: 'Annulla', fn: () => { c.archived = false; save(); render(); } } }); };
A.clientRestore = d => { const c = client(d.id); if (!c) return; c.archived = false; save(); render(); toast('Cliente ripristinato'); };
A.clientDel = d => {
  const c = client(d.id); if (!c) return;
  const nj = db.jobs.filter(j => j.clientId === c.id).length;
  confirmBox({ title: `Eliminare ${c.name}?`, text: `Verranno eliminati anche i suoi animali, ${plural(nj, 'lavoro', 'lavori')}, pagamenti e serie ricorrenti. Per conservare lo storico usa "Archivia".`, ok: 'Elimina tutto', danger: true,
    onOk: () => { const onPage = current.path === '/client/' + c.id;
      destructive('Cliente eliminato', () => { db.jobs = db.jobs.filter(j => j.clientId !== c.id); db.pets = db.pets.filter(p => p.clientId !== c.id); db.recurring = db.recurring.filter(r => r.clientId !== c.id); db.payments = db.payments.filter(p => p.clientId !== c.id); db.clients = db.clients.filter(x => x.id !== c.id); }, { render: !onPage });
      if (onPage) leave('#/clients'); } });
};
A.petAdd = d => petForm({ clientId: d.client });
A.petEdit = d => petForm({ id: d.id });
A.expAdd = () => expenseForm(); A.expEdit = d => expenseForm(d.id);
A.svcAdd = () => serviceForm(); A.svcEdit = d => serviceForm(d.id);
A.recAdd = () => recurringForm(); A.recEdit = d => recurringForm(d.id);
A.recToggle = d => { const r = db.recurring.find(x => x.id === d.id); if (!r) return; r.active = !r.active; if (r.active) generateRecurring(); save(); render(); toast(r.active ? 'Serie riattivata' : 'Serie in pausa: non verranno creati nuovi lavori'); };
A.recDel = d => { const r = db.recurring.find(x => x.id === d.id); if (!r) return; confirmBox({ title: 'Eliminare la serie?', text: 'I lavori futuri ancora programmati verranno eliminati. Quelli passati restano.', ok: 'Elimina serie', danger: true, onOk: () => destructive('Serie eliminata', () => { removeFutureSeriesJobs(r.id, todayStr()); db.recurring = db.recurring.filter(x => x.id !== r.id); }) }); };
A.netInfo = () => infoSheet('Come si calcola l\'utile netto', '<p><b>Utile netto = incassato + mance − spese.</b></p><ul><li><b>Incassato</b>: i soldi realmente ricevuti nel mese, contati nella data in cui li hai registrati (anche anticipi per lavori futuri), più i lavori segnati come pagati a parte.</li><li><b>Mance</b>: quelle registrate sui lavori completati.</li><li><b>Spese</b>: tutte le spese inserite, più il costo chilometrico se hai impostato un costo per km.</li><li>I lavori svolti ma <b>non ancora pagati</b> non entrano nell\'utile: compaiono in «Da incassare».</li></ul>');
A.install = async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (_) {} deferredInstall = null; render(); };
A.dismissInstall = () => { db.meta.dismissedInstall = true; save(); render(); };
A.installHelp = () => infoSheet('Installare su Android', '<ol><li>Apri l\'app da <b>Chrome</b> (o Samsung Internet).</li><li>Tocca il menu <b>⋮</b> in alto a destra.</li><li>Scegli <b>«Installa app»</b> oppure <b>«Aggiungi a schermata Home»</b>.</li><li>Conferma: l\'icona apparirà tra le tue app e funzionerà anche offline.</li></ol><p class="muted">Dopo l\'installazione apri sempre l\'app dall\'icona, così i dati restano gli stessi.</p>');
A.persist = async () => { try { const ok = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; toast(ok ? 'Dati protetti dalla pulizia automatica' : 'Il browser non ha concesso la protezione: installa l\'app e riprova', { type: ok ? '' : 'err' }); render(); } catch (e) { toast('Non supportato su questo browser', { type: 'err' }); } };
A.checkUpdate = async () => { try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); toast('Controllo fatto. Eventuali novità si applicano al prossimo avvio.', { action: { label: 'Ricarica', fn: () => location.reload() } }); } catch (e) { toast('Controllo non disponibile offline', { type: 'err' }); } };
A.exp = d => {
  const R = exportRangeDates(), day = todayStr();
  if (d.w === 'jobs') download(`lavori-${R.tag}.csv`, csvJobs(R.from, R.to), 'text/csv;charset=utf-8');
  if (d.w === 'clients') download(`clienti-${day}.csv`, csvClients(), 'text/csv;charset=utf-8');
  if (d.w === 'payments') download(`pagamenti-${R.tag}.csv`, csvPayments(R.from, R.to), 'text/csv;charset=utf-8');
  if (d.w === 'expenses') download(`spese-${R.tag}.csv`, csvExpenses(R.from, R.to), 'text/csv;charset=utf-8');
  toast('File CSV scaricato');
};
const backupJSON = () => JSON.stringify({ app: 'pet-sitter-profit', exported: new Date().toISOString(), ...db }, null, 1);
const markBackup = () => { db.meta.lastBackup = new Date().toISOString(); save(); };
A.backupDownload = () => { download(`pet-sitter-profit-backup-${todayStr()}.json`, backupJSON(), 'application/json'); markBackup(); render(); toast('Backup scaricato'); };
A.backupShare = async () => { const ok = await shareFile(`pet-sitter-profit-backup-${todayStr()}.json`, backupJSON(), 'application/json'); if (ok) { markBackup(); render(); toast('Backup condiviso'); } else A.backupDownload(); };
A.backupPick = () => $('#restoreFile').click();
async function restoreFromFile(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d !== 'object' || !Array.isArray(d.jobs) || !Array.isArray(d.clients)) throw new Error('formato');
    const nd = migrate(d);
    confirmBox({ title: 'Ripristinare i dati?', text: `Il file contiene ${plural(nd.clients.length, 'cliente', 'clienti')}, ${plural(nd.pets.length, 'animale', 'animali')}, ${plural(nd.jobs.length, 'lavoro', 'lavori')} e ${plural(nd.expenses.length, 'spesa', 'spese')}. I dati attuali verranno sostituiti.`, ok: 'Ripristina', danger: true,
      onOk: () => { const old = JSON.stringify(db); db = nd; save(); applyTheme(); render(); toast('Dati ripristinati', { action: { label: 'Annulla', fn: () => { db = migrate(JSON.parse(old)); save(); applyTheme(); render(); } } }); } });
  } catch (e) { toast('File non valido: scegli un backup di Pet Sitter Profit', { type: 'err' }); }
}
A.wipe = () => openSheet({ title: 'Eliminare tutti i dati?', submit: 'Elimina definitivamente',
  body: `<p class="prose">Verranno cancellati clienti, animali, lavori, spese e impostazioni da questo telefono. <b>L'operazione non si può annullare.</b> Fai prima un backup.</p>${field('Scrivi ELIMINA per confermare', fInput('confirm', '', { attrs: 'autocomplete="off" autocapitalize="characters"' }))}`,
  onSubmit: (d, form) => { if (d.confirm.trim().toUpperCase() !== 'ELIMINA') return setErr(form, 'confirm', 'Scrivi ELIMINA per procedere'); db = freshDB(); save(); applyTheme(); closeTop(() => { go('#/', true); toast('Tutti i dati sono stati eliminati'); }); return false; } });
A.repMode = d => { ui.repMode = d.m; render(); };
A.repNav = d => { if (ui.repMode === 'month') ui.repMonth = shiftMonth(ui.repMonth, +d.d); else ui.repYear += +d.d; render(); };
A.repCsv = () => { const R = reportRange(); download(`lavori-${R.label.replace(/\s+/g, '-').toLowerCase()}.csv`, csvJobs(R.from, R.to), 'text/csv;charset=utf-8'); toast('File CSV scaricato'); };
A.print = () => window.print();
A.pricingApply = d => { const sv = service(d.id); if (!sv) return; sv.price = +d.price; save(); toast(`Prezzo di «${sv.name}» aggiornato a ${money(sv.price)}`); };

/* ===== eventi globali ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const fn = A[t.dataset.act]; if (fn) { e.preventDefault(); fn(t.dataset, t, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.input === 'owedClient') { ui.owedClient = t.value; const r = $('#owedRes'); if (r) r.innerHTML = owedHTML(); return; }
  if (t.dataset && t.dataset.input === 'clientQuery') { ui.clientQuery = t.value; const l = $('#clist'); if (l) l.innerHTML = clientListHTML(); return; }
  if (t.dataset && t.dataset.setting) applySetting(t);
  if (current.path === '/pricing' && t.closest && t.closest('#view')) { if (t.name === 'svc') return; calcPricing(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'restoreFile') { const f = t.files[0]; t.value = ''; if (f) restoreFromFile(f); return; }
  if (t.dataset && t.dataset.change === 'exportRange') { ui.exportRange = t.value; return; }
  if (t.dataset && t.dataset.setting) { applySetting(t); toast('Salvato'); return; }
  if (current.path === '/pricing' && t.name === 'svc') {
    const sv = service(t.value), g = n => $(`#view [name="${n}"]`);
    if (sv) { g('price').value = String(sv.price).replace('.', ','); g('minutes').value = sv.minutes; }
    calcPricing();
  }
});
function applySetting(t) {
  const k = t.dataset.setting; let v = t.value;
  if (['kmCost', 'defaultKm', 'taxRate', 'goal', 'hourlyTarget'].includes(k)) v = Math.max(0, num(v));
  if (k === 'name') v = v.trim().slice(0, 40);
  db.settings[k] = v; save(); if (k === 'theme') applyTheme();
}

'use strict';
/* Pet Sitter Profit — avvio, tema, service worker, installazione */
function applyTheme() {
  const t = db.settings.theme || 'auto';
  document.documentElement.dataset.theme = t;
  const dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = dark ? '#0d1411' : '#f6f7f4';
}
window.addEventListener('hashchange', route);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (current.path === '/' || current.path === '/more') render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('App installata ✓'); render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { const ch = generateRecurring(); if (autoCompleteJobs()) save(); if (!overlays.length) render(); } });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

applyTheme();
generateRecurring();
if (autoCompleteJobs()) save();
setInterval(() => { if (document.visibilityState === 'visible' && autoCompleteJobs()) { save(); if (!overlays.length) render(); } }, 30000);
route();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol !== 'file:' && !isNative()) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

</script>
</body>
</html>
